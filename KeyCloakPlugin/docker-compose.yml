# docker-compose.yml — ambiente di test per il plugin hardware-prf-totp.
#
# ATTENZIONE: questa configurazione e' pensata per sviluppo/test locale.
# Per produzione servono, come minimo: hostname pubblico reale con
# certificato TLS valido davanti a un reverse proxy (WebAuthn richiede
# HTTPS reale, non solo "secure context" locale), gestione segreti (non
# variabili d'ambiente in chiaro), e revisione delle impostazioni DB.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: change-me-in-real-deployments
    volumes:
      - kc_pg_data:/var/lib/postgresql/data

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: change-me-in-real-deployments
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # In sviluppo locale su http://localhost, WebAuthn tratta "localhost"
      # come secure context anche senza TLS. Per qualunque altro hostname
      # serve HTTPS reale — vedi nota sopra.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    container_name: zerotp-keycloak-v120      
    ports:
      - "8091:8080"
    command: ["start-dev"]

volumes:
  kc_pg_data:
